name: Backend Build & Deploy to ECR

on:
  push:
    branches:
      - "master"
      - "feat_*"
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Tag for backend image"
        required: false
        default: "backend"

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend
        run: |
          BACKEND_TAG="${{ github.event.inputs.backend_tag }}"
          if [ -z "$BACKEND_TAG" ]; then
            BACKEND_TAG=backend
          fi

          docker build -t ${{ secrets.ECR_REGISTRY }}/hazem/backend:$BACKEND_TAG .
          docker push ${{ secrets.ECR_REGISTRY }}/hazem/backend:$BACKEND_TAG

